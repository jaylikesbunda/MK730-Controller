name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version number (e.g. 0.2.0, no leading v)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: t
        run: |
          VER="${{ inputs.version }}"
          VER="${VER#v}"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
      - name: set versions
        run: |
          VER="${{ steps.t.outputs.version }}"
          sed -i "s/^version = .*/version = \"${VER}\"/" crates/mk730-core/Cargo.toml
          sed -i "s/^version = .*/version = \"${VER}\"/" src-tauri/Cargo.toml
          python3 - <<PY
          import json
          p="src-tauri/tauri.conf.json"
          d=json.load(open(p))
          d["version"]="${VER}"
          json.dump(d,open(p,"w"),indent=2)
          print("tauri.conf -> ${VER}")
          PY
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "release v${VER}" || echo "nothing to commit"
          git tag "v${VER}"
          git push origin "v${VER}" || echo "no remote / push skipped (local repo)"

  build:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: ""
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: system deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libusb-1.0-0-dev libudev-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: build tauri bundles
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.tag.outputs.tag }}
          releaseName: "MK730 Controller ${{ needs.tag.outputs.tag }}"
          releaseBody: "Open-source MK730 controller. Linux + Windows bundles. See README for udev/Zadig notes."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
